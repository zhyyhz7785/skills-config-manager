name: Feature request
description: Propose a change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "CCM is a ledger (library ≠ in effect), not a 50-agent marketplace."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should CCM do instead? Keep it small.
    validations:
      required: true
