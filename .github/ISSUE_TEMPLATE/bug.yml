name: Bug report
description: Something does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "0.2.0 is a Windows preview. Search existing issues first."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, expected, actual.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0 / commit SHA"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Windows build, Cursor/Claude/Codex, library path (no personal usernames).
    validations:
      required: true
