[[permission]]
identifier = "allow-ui-state"
description = "Persist nav/filters/selection/layout via Rust settings"
commands.allow = [
  "set_nav",
  "set_workspace_visibility",
  "set_default_workspace",
  "update_workspace_config",
  "set_filters",
  "set_selection",
  "set_detail_mode",
  "set_cluster_mode",
  "set_purpose_domain_filter",
  "set_ui_layout"
]
