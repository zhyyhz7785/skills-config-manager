[package]
name = "ccm-tauri2"
version = "0.2.0"
description = "Skills Config Manager (CCM): local-first library and ledger for Cursor / Claude / Codex skills and rules"
authors = ["zhyyhz7785"]
license = "MIT"
repository = "https://github.com/zhyyhz7785/skills-config-manager"
edition = "2021"
default-run = "ccm-tauri2"

[lib]
name = "ccm_tauri2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ccm"
path = "src/bin/ccm.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
